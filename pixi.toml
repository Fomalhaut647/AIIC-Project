[workspace]
authors = ["Fomalhaut647 <fomalhaut@stu.pku.edu.cn>"]
channels = ["conda-forge"]
name = "AIIC-Project"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
serve = "uvicorn server.main:app --host 127.0.0.1 --port 8000 --reload"
serve-prod = "uvicorn server.main:app --host 127.0.0.1 --port 8000"
test = "pytest"
synthesize-questions = "python scripts/synthesize_questions.py"

[dependencies]
python-dotenv = ">=1.2.2,<2"
pymupdf = ">=1.27.2.2,<2"
fastapi = ">=0.136.1,<0.137"
uvicorn = ">=0.46.0,<0.47"
httpx = ">=0.28.1,<0.29"
pytest = ">=9.0.3,<10"
pytest-asyncio = ">=1.3.0,<2"
pydantic = ">=2.13.4,<3"
python-docx = ">=1.1,<2"
ffmpeg = ">=8.1.1,<9"
